<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Request Diet Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 20px;
      color: green;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Get Your Diet Plan</h2>
  <form id="dietForm">
    <label for="name">Name:</label>
    <input type="text" name="name" required>

    <label for="gender">Gender:</label>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="whatsapp">Your WhatsApp Number:</label>
    <input type="tel" name="whatsapp" placeholder="Include country code (e.g. +91...)" required>

    <button type="submit">Send WhatsApp Message</button>
  </form>

  <p id="status"></p>
</div>

<script>
  const form = document.getElementById("dietForm");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    const name = formData.get("name");

    // Fixed receiver number
    const myNumber = "8110036595";

    // Message only includes the name
    const message = `Hi I am ${name}, Can I get my diet plan?`;

    // WhatsApp link
    const waLink = `https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`;

    // Open WhatsApp
    window.open(waLink, "_blank");

    // Show status
    document.getElementById("status").textContent = "Opening WhatsApp...";
  });
</script>

</body>
</html>
