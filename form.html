<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QR Code Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 20px;
      color: green;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Fill Your Details</h2>
  <form id="qrForm">
    <label for="name">Name:</label>
    <input type="text" name="name" required>

    <label>Gender:</label>
    <select name="gender" required>
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="whatsapp">WhatsApp Number:</label>
    <input type="tel" name="whatsapp" placeholder="Include country code (e.g. +91...)" required>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>
</div>

<script>
  const form = document.getElementById("qrForm");

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    const whatsapp = formData.get("whatsapp");

    // Format number (remove + and spaces)
    const cleanNumber = whatsapp.replace("+", "").replace(/\s/g, "");

    // WhatsApp message
    const message = "Hi";

    // Open WhatsApp with message
    const waLink = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(message)}`;
    window.open(waLink, "_blank");

    // Show confirmation
    document.getElementById("status").textContent = "Opening WhatsApp...";
  });
</script>

</body>
</html>
