<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>QR Code Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Fill Your Details</h2>
  <form id="qrForm">
    <label for="name">Name:</label>
    <input type="text" name="name" required>

    <label>Gender:</label>
    <select name="gender" required>
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="whatsapp">WhatsApp Number:</label>
    <input type="tel" name="whatsapp" placeholder="Include country code (e.g. +91...)" required>

    <input type="hidden" name="code" id="code" value="">

    <button type="submit">Submit</button>
  </form>

  <p id="status" style="margin-top: 20px; color: green;"></p>
</div>

<script>
  const form = document.getElementById("qrForm");
  const status = document.getElementById("status");

  // Extract the ?code=XYZ123 from URL
  const urlParams = new URLSearchParams(window.location.search);
  const code = urlParams.get('code');
  if (code) {
    document.getElementById("code").value = code;
  }

  form.addEventListener("submit", function(e) {
    e.preventDefault();
    status.textContent = "Submitting...";

    const formData = new FormData(form);

    fetch("https://script.google.com/macros/s/AKfycbw206D9VCMpuxzFp1N_dG_2653RhtocD99gGq71Txbq6G-3ELfJU90MN9B3sL6DRUvDig/exec", {
      method: "POST",
      body: formData
    })
    .then(res => res.text())
    .then(response => {
      status.textContent = "Submitted successfully!";
      
      const data = JSON.parse(response);
      if (data && data.pdfUrl && data.whatsappNumber) {
        const message = `Hi, here is your form confirmation PDF: ${data.pdfUrl}`;
        const waLink = `https://wa.me/${data.whatsappNumber}?text=${encodeURIComponent(message)}`;
        window.open(waLink, '_blank');
      }
    })
    .catch(err => {
      console.error(err);
      status.textContent = "Submission failed. Try again.";
    });
  });
</script>

</body>
</html>
