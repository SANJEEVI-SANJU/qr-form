<!-- form.html -->
<!DOCTYPE html>
<html>
<head>
  <title>QR Form</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, select { margin: 10px 0; padding: 10px; width: 100%; }
    button { padding: 10px 20px; background-color: green; color: white; border: none; }
  </style>
</head>
<body>
  <h2>Fill Your Details</h2>
  <form id="userForm">
    <input type="text" name="name" placeholder="Name" required />
    <label>Gender:</label>
    <label><input type="radio" name="gender" value="Male" required /> Male</label>
    <label><input type="radio" name="gender" value="Female" required /> Female</label><br>
    <input type="tel" name="whatsapp" placeholder="WhatsApp Number" required />
    <input type="hidden" name="code" id="codeField" />
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById('codeField').value = new URLSearchParams(window.location.search).get('code');

    document.getElementById('userForm').addEventListener('submit', function (e) {
      e.preventDefault();

      const form = new FormData(this);
      fetch('https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec', {
        method: 'POST',
        body: form
      }).then(() => {
        alert('Submitted successfully!');
        window.location.href = 'https://wa.me/91' + form.get("whatsapp") + '?text=Hi, your PDF report has been created: https://your-pdf-bucket/' + form.get("code") + '.pdf';
      });
    });
  </script>
</body>
</html>
