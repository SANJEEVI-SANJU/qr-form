<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Get Your Diet Plan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
    }
    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Get Your Diet Plan</h2>
  <form id="dietForm">
    <label for="name">Name:</label>
    <input type="text" name="name" required />

    <label for="gender">Gender:</label>
    <select name="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Other">Other</option>
    </select>

    <label for="whatsapp">WhatsApp Number:</label>
    <input type="tel" name="whatsapp" placeholder="+91..." required />

    <button type="submit">Get Diet Plan</button>
  </form>
  <p id="status"></p>
</div>

<script>
  const form = document.getElementById("dietForm");
  const status = document.getElementById("status");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData(form);
    const name = formData.get("name");
    const gender = formData.get("gender");
    const whatsapp = formData.get("whatsapp");

    status.textContent = "Processing...";

    try {
      const response = await fetch("http://localhost:3000/api/sendPdf", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, gender, whatsapp }),
      });

      const data = await response.json();

      if (data.success) {
        status.textContent = "✅ PDF sent to your WhatsApp!";
        status.style.color = "green";
      } else {
        status.textContent = "❌ Failed to send. Try again.";
        status.style.color = "red";
      }
    } catch (err) {
      console.error(err);
      status.textContent = "❌ Server error.";
      status.style.color = "red";
    }
  });
</script>

</body>
</html>
